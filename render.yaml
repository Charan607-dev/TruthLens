services:
  - type: web
    name: truthlens-ai-backend
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: truthlens-ai-frontend
    runtime: static
    buildCommand: |
      if [ -z "$VITE_API_URL" ] && [ -n "$BACKEND_HOST" ]; then
        case "$BACKEND_HOST" in
          *.onrender.com) export VITE_API_URL="https://$BACKEND_HOST" ;;
          *) export VITE_API_URL="https://$BACKEND_HOST.onrender.com" ;;
        esac
      fi
      npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: BACKEND_HOST
        fromService:
          type: web
          name: truthlens-ai-backend
          property: host
      - key: VITE_API_URL
        sync: false
